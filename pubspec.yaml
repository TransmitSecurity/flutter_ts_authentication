name: flutter_ts_authentication
description: "A Flutter plugin for the Transmit Security Authentication SDK."
version: 0.0.5
homepage: transmitsecurity.com

environment:
  sdk: ^3.8.1
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.flutter_ts_authentication
        pluginClass: FlutterTsAuthenticationPlugin
      ios:
        pluginClass: FlutterTsAuthenticationPlugin
